name: FinTrack Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files when missing
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org id.fintrack --project-name fintrack .
          fi

      - name: Set Android compile SDK to 36
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          candidates = [
              Path("android/app/build.gradle.kts"),
              Path("android/app/build.gradle"),
          ]
          app_gradle = next((path for path in candidates if path.exists()), None)
          if app_gradle is None:
              raise SystemExit("Android app Gradle file was not generated")

          content = app_gradle.read_text()
          updated, count = re.subn(
              r"(?m)^([ \t]*)(?:compileSdk|compileSdkVersion)(?:[ \t]*=[ \t]*|[ \t]+)(?:flutter\.compileSdkVersion|[0-9]+)",
              lambda match: match.group(1) + (
                  "compileSdk = 36" if app_gradle.suffix == ".kts"
                  else "compileSdkVersion 36"
              ),
              content,
          )
          if count == 0:
              raise SystemExit(
                  "Could not find compileSdk declaration in " + str(app_gradle)
                  + "\\n" + content
              )
          app_gradle.write_text(updated)
          print("Updated " + str(app_gradle) + " compileSdk declaration:")
          for line in updated.splitlines():
              if "compileSdk" in line:
                  print(line)
          PY

      - name: Configure Android notification scheduling
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          gradle_candidates = [
              Path("android/app/build.gradle.kts"),
              Path("android/app/build.gradle"),
          ]
          gradle = next((p for p in gradle_candidates if p.exists()), None)
          if gradle is None:
              raise SystemExit("Android app Gradle file not found")

          content = gradle.read_text()
          if gradle.suffix == ".kts":
              if "isCoreLibraryDesugaringEnabled" not in content:
                  content, count = re.subn(
                      r"(compileOptions\s*\{)",
                      r"\1\n        isCoreLibraryDesugaringEnabled = true",
                      content, count=1,
                  )
                  if count == 0:
                      raise SystemExit("compileOptions block not found")
              dependency = 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")'
              addition = dependency
          else:
              if "coreLibraryDesugaringEnabled true" not in content:
                  content, count = re.subn(
                      r"(compileOptions\s*\{)",
                      r"\1\n        coreLibraryDesugaringEnabled true",
                      content, count=1,
                  )
                  if count == 0:
                      raise SystemExit("compileOptions block not found")
              dependency = "coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'"
              addition = dependency

          if dependency not in content:
              if "dependencies {" in content:
                  content = content.replace(
                      "dependencies {", "dependencies {\n    " + addition, 1
                  )
              else:
                  content += "\ndependencies {\n    " + addition + "\n}\n"
          gradle.write_text(content)

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          if not manifest.exists():
              raise SystemExit("AndroidManifest.xml not found")
          xml = manifest.read_text()
          xml, label_count = re.subn(r'android:label="[^"]+"', 'android:label="FinTrack Paday"', xml, count=1)
          if label_count == 0:
              raise SystemExit("Application label attribute not found in AndroidManifest.xml")
          permission = '    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />'
          if "android.permission.RECEIVE_BOOT_COMPLETED" not in xml:
              xml, count = re.subn(
                  r"(<manifest\b[^>]*>)", r"\1\n" + permission, xml, count=1
              )
              if count == 0:
                  raise SystemExit("Manifest root tag not found")

          receivers = '''
              <receiver
                  android:exported="false"
                  android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver" />
              <receiver
                  android:exported="false"
                  android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver">
                  <intent-filter>
                      <action android:name="android.intent.action.BOOT_COMPLETED"/>
                      <action android:name="android.intent.action.MY_PACKAGE_REPLACED"/>
                      <action android:name="android.intent.action.QUICKBOOT_POWERON" />
                      <action android:name="com.htc.intent.action.QUICKBOOT_POWERON"/>
                  </intent-filter>
              </receiver>
          '''
          if "ScheduledNotificationReceiver" not in xml:
              xml = xml.replace("</application>", receivers + "\n    </application>", 1)
          manifest.write_text(xml)
          print("Configured notification permissions, reboot receivers and Java desugaring.")
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Drift code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fintrack-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
